# Formerly cimas-managed. Now consumer-owned per metanorma/cimas#68
# (workflow-file conversion from cimas-synced copied stubs to reusable-workflow
# references). Pins metanorma/ci reusable at @v1 (moving major, three-tier
# tagging discipline per metanorma/ci#372).
#
# cascade is false: reverse_adoc is a facade gem whose releases are dispatched
# manually (gh workflow run release.yml -f next_version=x.y.z). The default
# cascade fires do-release on every green push to main, which on a facade gem
# only re-builds the already-published version and lands a red duplicate-push
# run on main.
name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: read

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@v1
    with:
      cascade: false
    secrets:
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
